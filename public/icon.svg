<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#15241b" />
      <stop offset="100%" stop-color="#060a0f" />
    </radialGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92b683" />
      <stop offset="100%" stop-color="#55754d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="#2d4231" stroke-width="6" opacity="0.6" />

  <!-- Outer Ring / Shield -->
  <circle cx="256" cy="235" r="130" fill="none" stroke="url(#neonGreen)" stroke-width="20" stroke-linecap="round" stroke-dasharray="600 60" filter="url(#glow)" />
  
  <!-- Stylized Dumbbell / Core Silhouette -->
  <path d="M190 235 L322 235" stroke="#e2eaf4" stroke-width="16" stroke-linecap="round" />
  <!-- Left Weight Plate -->
  <rect x="170" y="195" width="22" height="80" rx="8" fill="url(#neonGreen)" />
  <rect x="145" y="210" width="18" height="50" rx="6" fill="#759667" />
  <!-- Right Weight Plate -->
  <rect x="320" y="195" width="22" height="80" rx="8" fill="url(#neonGreen)" />
  <rect x="349" y="210" width="18" height="50" rx="6" fill="#759667" />

  <!-- Center Heartbeat / Lightning accent -->
  <path d="M226 235 L244 205 L268 265 L286 235" fill="none" stroke="#92b683" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Typography Brand -->
  <text x="238" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#e2eaf4" letter-spacing="8" text-anchor="middle">ONNESS</text>
  <!-- Accent Dot -->
  <circle cx="340" cy="415" r="10" fill="#759667" filter="url(#glow)" />
</svg>
